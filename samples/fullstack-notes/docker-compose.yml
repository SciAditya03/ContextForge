services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: notes
      POSTGRES_DB: notes
    ports: ["5432:5432"]
  redis:
    image: redis:7
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://notes:notes@db:5432/notes
      JWT_SECRET: ${JWT_SECRET}
    ports: ["4000:4000"]
    depends_on: [db, redis]
  web:
    build: ./frontend
    ports: ["5173:5173"]
    depends_on: [api]
